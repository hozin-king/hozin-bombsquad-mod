name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Install NDK + CMake (pakai SDK bawaan runner)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;25.2.9519653" "cmake;3.22.1" \
            "platforms;android-34" "build-tools;34.0.0"

      - name: Siapkan keystore rilis dari Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 kosong — set dulu 4 Secrets repo (lihat README)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          ls -l "$RUNNER_TEMP/release.keystore"

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Verifikasi APK
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK=$APK"
          python3 -c "import zipfile,sys; z=zipfile.ZipFile(sys.argv[1]); print('zip valid, entri:', len(z.namelist()))" "$APK"
          ls -l "$APK"

      - name: Buat Release v1.0 + upload APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" BombSquadMod-v1.0.apk
          cat > release-notes.md <<'EOF'
          # Hozin BombSquad Mod v1.0 🧪 EKSPERIMENTAL

          Aplikasi injector root (KernelSU) untuk BombSquad 1.8.4
          (`net.froemling.bombsquad`). Inject payload ke game yang sedang
          jalan — TANPA resign APK game (signature resmi tetap utuh).

          ## ⚠️ STATUS JUJUR — BACA DULU
          - **Semua fitur v1.0 berlabel EKSPERIMENTAL.** Offset/pattern
            runtime `libmain.so` BELUM terverifikasi — butuh riset offset
            di HP root (libmain.so stripped, tanpa simbol debug).
          - Yang v1.0 SUDAH lakukan nyata: inject + handshake status +
            GATE SESI runtime (fail-closed, lihat bawah). Toggle tidak akan
            aktif sampai pola fitur ditemukan di riset lanjutan.
          - **Jangan klaim fitur sudah jalan sebelum uji HP.**

          ## Fitur (menu overlay, semua default OFF)
          - God Mode, Speed (1.5x)
          - Paket cheat aneh: gravitasi bulan / nol / berat, skala karakter
            raksasa / mini, ledakan raksasa, pukulan super, slow motion,
            bot bego, bot beku
          - Bom teleport lengket: bom yang dilempar pindah ke musuh
            terdekat + paksa tipe sticky bawaan game

          ## Gate keamanan (fail-closed, satu boolean penjaga)
          - `isLocalSession` di payload, dievaluasi tiap detik dari koneksi
            jaringan proses game sendiri.
          - Sesi online (public party, turnamen, apa pun yang nyambung
            pemain lain/server) ATAU jenis sesi tak pasti → SEMUA fitur
            dipaksa OFF, apa pun posisi toggle.
          - Hanya sesi lokal (solo vs bot / multiplayer lokal satu
            perangkat) yang boleh mengaktifkan fitur.

          ## YANG TIDAK ADA (dan tidak akan ditambahkan)
          Unlock karakter/map/mini-game, unlimited ticket/token, Pro/Gold
          Pass gratis, remove_ads, cheat party publik, cheat turnamen/liga
          — semuanya server-side / bypass pembelian / merugikan pemain asli.

          ## Cara pakai
          1. HP harus root (KernelSU). Install BombSquad resmi dulu.
          2. Install APK ini. Izinkan "tampil di atas aplikasi lain".
          3. Buka game → auto-inject → logo "B" mengambang → tap → panel.
          4. Nyalakan toggle hanya saat main solo lokal.
          5. "Keluar & bersihkan jejak" untuk stop + hapus staging .so.

          ## Yang masih menunggu
          - Uji HP: inject jalan? status payload muncul? gate membaca sesi
            dengan benar?
          - Riset offset runtime libmain.so per fitur (pattern-scan, bukan
            offset hardcode) — lihat `app/src/main/cpp/payload/patterns.h`.
          EOF
          gh release view v1.0 >/dev/null 2>&1 && gh release delete v1.0 -y --cleanup-tag || true
          gh release create v1.0 --title "Hozin BombSquad Mod v1.0" --notes-file release-notes.md BombSquadMod-v1.0.apk
